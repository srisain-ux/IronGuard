[project]
name = "ironguard-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sse-starlette>=2,<4",
  "openai>=1,<3", "httpx>=0.27,<1", "jsonschema[format]>=4,<5",
  "pydantic>=2,<3", "ironguard-ml",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv.sources]
ironguard-ml = { path = "../ml", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
