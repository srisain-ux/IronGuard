[project]
name = "ironguard-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch", "sentence-transformers", "scikit-learn", "numpy", "onnx",
  "onnxruntime", "jsonschema", "pytest", "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ironguard_ml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
